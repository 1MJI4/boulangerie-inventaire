# netlify.toml

[build]
  # scripts/build.js enchaine `prisma generate` puis `next build`.
  # Regenerer le client a chaque build est indispensable : le cache de Netlify
  # peut resservir un node_modules ou le client ne connait pas le schema actuel.
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Prisma telecharge ses moteurs pendant le build ; sans cela un cache partiel
  # fait echouer la verification de somme de controle.
  PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Fonction dediee a l'imprimante Star (netlify/functions/imprimante.mts), servie
# a /api/cloudprnt/<cle>, et sa tache de reveil (imprimante-reveil.mts). Elles
# n'utilisent pas Prisma (client PostgreSQL leger) : rien a joindre au paquet.
[functions.imprimante]
  node_bundler = "esbuild"

# L'application lit et ecrit la saisie en cours : rien ne doit etre mis en cache.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

# En-tetes de securite (CSP, frame-ancestors, nosniff, Referrer-Policy, HSTS) :
# declares UNE seule fois, dans next.config.ts (fonction headers), et appliques
# par le runtime Next de Netlify. Ne pas les redeclarer ici : deux politiques
# CSP s'additionnent et la plus stricte casse l'application sans prevenir.
